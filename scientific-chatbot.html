<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific RAG Chatbot</title>
  <style>
    :root { color-scheme: dark; --bg:#06111f; --panel:#101b2f; --text:#f1f5f9; --muted:#94a3b8; --accent:#4cc9f0; }
    body { margin:0; font-family:Inter,Segoe UI,sans-serif; background:linear-gradient(135deg,#06111f,#0f172a); color:var(--text); min-height:100vh; display:grid; place-items:center; padding:24px; }
    .shell { width:min(980px,100%); background:rgba(16,27,47,.95); border:1px solid rgba(255,255,255,.1); border-radius:24px; padding:24px; box-shadow:0 24px 70px rgba(0,0,0,.35); }
    .hero { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; }
    .hero h1 { margin:0; font-size:1.5rem; }
    .hero p { margin:4px 0 0; color:var(--muted); }
    .badge { padding:8px 12px; border-radius:999px; background:rgba(76,201,240,.18); color:var(--accent); font-weight:700; font-size:.9rem; }
    .chat { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:16px; min-height:360px; display:flex; flex-direction:column; }
    .messages { flex:1; overflow:auto; display:flex; flex-direction:column; gap:12px; margin-bottom:12px; }
    .msg { padding:12px 14px; border-radius:12px; max-width:85%; line-height:1.55; }
    .user { align-self:flex-end; background:var(--accent); color:#021018; }
    .bot { align-self:flex-start; background:rgba(255,255,255,.06); }
    .controls { display:flex; gap:10px; }
    input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:#0b1425; color:var(--text); }
    button { padding:12px 16px; border:none; border-radius:12px; background:var(--accent); color:#021018; font-weight:700; cursor:pointer; }
    .meta { font-size:.85rem; color:var(--muted); margin-top:6px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div>
        <h1>Scientific RAG Assistant</h1>
        <p>Multi-language scientific Q&amp;A with retrieval-backed answers and source references.</p>
      </div>
      <div class="badge">Multi-language • Fast • Secure</div>
    </div>

    <div class="chat">
      <div class="messages" id="messages"></div>
      <div class="controls">
        <input id="question" placeholder="Ask about AI, drug discovery, biology, chemistry, or climate science..." />
        <button onclick="sendMessage()">Ask</button>
      </div>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const question = document.getElementById('question');

    function addMessage(content, role = 'bot') {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = content;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const text = question.value.trim();
      if (!text) return;
      addMessage(text.replace(/\n/g, '<br/>'), 'user');
      question.value = '';
      addMessage('Searching the knowledge base...', 'bot');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        const reply = data.reply || 'No response';
        const sources = data.sources?.length ? `<div class="meta">Sources: ${data.sources.map((s) => s.title).join(', ')}</div>` : '';
        messages.lastChild.remove();
        addMessage(`${reply}<div class="meta">Language: ${data.language || 'en'}</div>${sources}`, 'bot');
      } catch (error) {
        messages.lastChild.remove();
        addMessage('The backend could not answer right now. Please start the RAG server first.', 'bot');
      }
    }

    question.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
