name: Personal OS CI

on:
  workflow_dispatch:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: personal-os-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Agent runtime policy tests
        run: npm run test:agent-runtime
      - name: Free-first AI gateway tests
        run: npm run test:ai-gateway
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build


  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: personal_os_test
          POSTGRES_PASSWORD: personal_os_test
          POSTGRES_DB: personal_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_os_test -d personal_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create minimal Better Auth user table fixture
        env:
          PGPASSWORD: personal_os_test
        run: psql -h 127.0.0.1 -U personal_os_test -d personal_os_test -v ON_ERROR_STOP=1 -c 'CREATE TABLE "user" (id text PRIMARY KEY);'
      - name: Apply Personal OS core migration
        env:
          PGPASSWORD: personal_os_test
        run: psql -h 127.0.0.1 -U personal_os_test -d personal_os_test -v ON_ERROR_STOP=1 -f db/migrations/0001_personal_os_core.sql
      - name: Apply hardware inventory and BOM migration
        env:
          PGPASSWORD: personal_os_test
        run: psql -h 127.0.0.1 -U personal_os_test -d personal_os_test -v ON_ERROR_STOP=1 -f db/migrations/0002_hardware_inventory_bom.sql
      - name: Apply immutable hardware stock ledger migration
        env:
          PGPASSWORD: personal_os_test
        run: psql -h 127.0.0.1 -U personal_os_test -d personal_os_test -v ON_ERROR_STOP=1 -f db/migrations/0003_hardware_stock_ledger.sql
      - name: Smoke-test project/task activity journal and append-only guard
        env:
          PGPASSWORD: personal_os_test
        run: psql -h 127.0.0.1 -U personal_os_test -d personal_os_test -v ON_ERROR_STOP=1 -f db/tests/activity_journal_smoke.sql

  deploy-preview:
    name: Deploy Personal AI OS preview
    needs: [validate, database-migrations]
    if: github.ref == 'refs/heads/integration/bikash-personal-ai-os'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: personal-os-preview-deploy
      cancel-in-progress: false
    steps:
      - name: Validate deployment secrets
        env:
          VPS_DEPLOY_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_DEPLOY_HOST VPS_DEPLOY_USER VPS_DEPLOY_KEY VPS_DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Start restricted SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_KEY }}
      - name: Configure pinned VPS host key
        env:
          VPS_DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy CI-tested commit to isolated preview
        env:
          VPS_DEPLOY_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$VPS_DEPLOY_USER@$VPS_DEPLOY_HOST" "$GITHUB_SHA"
